openapi: 3.0.4
info:
  title: Aircraft Types
  description: >-
    Aircraft Types returns the physical and operational characteristics of an
    aircraft type from its ICAO designator, such as B738 or A320, or by
    searching manufacturer and model. Each type comes with wingspan, length,
    tail height, maximum takeoff and landing weight, approach speed and
    category, airplane design group, ICAO wake turbulence category and FAA
    weight class, with metric conversions. Paid plans add airport planning
    geometry, RECAT wake categories and US registration and traffic counts.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/aircrafttypes:
    get:
      summary: Aircraft Types
      description: >-
        Get the dimensions, weights, approach speed and wake category of an
        aircraft type by ICAO designator, or search by manufacturer and model
      operationId: aircrafttypes
      parameters:
        - name: icao
          in: query
          schema:
            type: string
          required: false
          description: >-
            ICAO aircraft type designator, for example B738, A20N or C172. When
            given, the other search parameters are ignored
          example: B738
        - name: manufacturer
          in: query
          schema:
            type: string
          required: false
          description: >-
            Manufacturer name or part of it, for example Boeing, Airbus or
            Cessna
          example: Airbus
        - name: model
          in: query
          schema:
            type: string
          required: false
          description: Model name or part of it, for example 737, A320 or Citation
          example: '737'
        - name: engineType
          in: query
          schema:
            type: string
          required: false
          description: Only types with this engine class
          example: jet
        - name: wakeCategory
          in: query
          schema:
            type: string
          required: false
          description: Only types in this ICAO wake turbulence category
          example: heavy
        - name: engines
          in: query
          schema:
            type: integer
          required: false
          description: Only types with this number of engines
          example: 2
        - name: limit
          in: query
          schema:
            type: integer
          required: false
          description: Maximum number of types to return, 1-50
          example: 10
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  count: 1
                  returned: 1
                  types:
                    - icaoCode: B738
                      faaDesignator: B738
                      manufacturer: BOEING
                      model: Boeing 737-800
                      variant: Boeing B737-800
                      aircraftClass: Fixed-wing
                      engineType: Jet
                      engineCount: 2
                      wingspanFt: 117.4
                      wingspanWithoutWingletsFt: 112.6
                      hasWinglets: true
                      lengthFt: 129.5
                      tailHeightFt: 41.4
                      maxTakeoffWeightLb: 174200
                      maxLandingWeightLb: 146275
                      approachSpeedKnots: 144
                      approachSpeedRangeKnots:
                        min: 140
                        max: 144
                      approachCategory: D
                      designGroup: III
                      icaoWakeCategory: Medium
                      faaWeightClass: Large
                      metric:
                        wingspanM: 35.78
                        lengthM: 39.47
                        tailHeightM: 12.62
                        maxTakeoffWeightKg: 79016
                        maxLandingWeightKg: 66349
                      airport:
                        taxiwayDesignGroup: '3'
                        wheelbaseFt: 51.2
                        cockpitToMainGearFt: 56.4
                        mainGearWidthFt: 23
                        mainGearConfig: D
                        parkingAreaFt2: 16487
                        parkingAreaM2: 1532
                        rotorDiameterFt: null
                      wake:
                        consolidatedCategory: F
                        recat15Category: D
                        recat2CategoryA: D
                        recat2CategoryB: C
                        sameRunwaySeparation: III
                        lahsoGroup: '8'
                      usage:
                        usRegistered: true
                        usRegistrations: 971
                        annualFlightPlanOperations: 2484764
                        operationsYear: 2024
                      remarks: >-
                        Depending on flaps configuration and MALW, AAC could be
                        C. AAC validated by Flight Standardization Board (FSB)
                        report.
                      lastUpdated: null
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
