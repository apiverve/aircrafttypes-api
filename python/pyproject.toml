[project]
name = "apiverve-aircrafttypes"
version = "1.2.6"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Aircraft Types returns the physical and operational characteristics of an aircraft type from its ICAO designator, such as B738 or A320, or by searching manufacturer and model. Each type comes with wingspan, length, tail height, maximum takeoff and landing weight, approach speed and category, airplane design group, ICAO wake turbulence category and FAA weight class, with metric conversions. Paid plans add airport planning geometry, RECAT wake categories and US registration and traffic counts."
keywords = ["aircraft types api", "aircraft specifications api", "aircraft dimensions", "icao aircraft type designator", "aircraft wingspan"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/aircrafttypes?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/aircrafttypes?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/aircrafttypes-api"
Twitter = "https://twitter.com/apivervehq"
